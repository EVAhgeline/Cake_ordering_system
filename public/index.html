
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cake Design & Ordering System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ======================================
         SIDEBAR
    ======================================= -->

    <aside class="sidebar">

        <div class="brand">
            <h2>🍰 Sweet Custom</h2>
        </div>

        <nav class="nav-menu">

            <button class="nav-btn active"
                    onclick="filterCategory('all')">
                🏠 Home
            </button>

            <div class="menu-section-title">
                Menu Categories
            </div>

        </nav>

    </aside>


    <!-- ======================================
         MAIN CONTENT
    ======================================= -->

    <main class="main-content">

        <header class="topbar">

            <h1>Cake Gallery</h1>

            <div class="cart-icon-wrapper"
                 onclick="toggleCartModal()">

                <div class="cart-icon">🛒</div>

                <span class="cart-badge"
                      id="cartBadgeCount">
                    0
                </span>

            </div>

        </header>


        <!-- CAKE GALLERY -->

        <section class="cake-grid"
                 id="cakeGridContainer">

            <!-- Cake cards generated by script.js -->

        </section>

    </main>


    <!-- ======================================
         CUSTOMIZATION MODAL
    ======================================= -->

    <div class="modal-backdrop" id="customizerModal">

        <div class="modal-card">

            <!-- CLOSE BUTTON -->

            <button class="close-btn"
                    onclick="closeCustomizerModal()">
                &times;
            </button>


            <!-- CAKE TITLE -->

            <h2 id="modalCakeTitle">
                Customize Cake
            </h2>


            <div class="modal-body">

                <!-- CAKE IMAGE -->

                <img id="modalCakeImg"
                     src=""
                     alt="Cake Preview"
                     class="modal-cake-img">


                <form id="customizeForm">

                    <input type="hidden"
                           id="modalCakeId">


                    <!-- ==================================
                         SIZE OPTIONS
                    =================================== -->

                    <div class="form-group">

                        <label for="sizeSelect">
                            Size Options:
                        </label>

                        <select id="sizeSelect"
                                onchange="calculateTotalPrice()">

                            <!-- Dynamic options -->

                        </select>

                    </div>


                    <!-- ==================================
                         FLAVOR OPTIONS
                    =================================== -->

                    <div class="form-group">

                        <label for="flavorSelect">
                            Flavor Options:
                        </label>

                        <select id="flavorSelect"
                                onchange="calculateTotalPrice()">

                            <!-- Dynamic options -->

                        </select>

                    </div>


                    <!-- ==================================
                         DESIGN SPECIFICATIONS
                    =================================== -->

                    <div class="form-group">

                        <label>
                            Design Specs & Add-ons:
                        </label>

                        <div class="spec-detail"
                             id="modalSpecsDetail">

                            <!-- Color, Pattern, Shape,
                                 Texture and Icing dropdowns
                                 generated by script.js -->

                        </div>

                    </div>


                    <!-- ==================================
                         BASE PRICE
                    =================================== -->

                    <div class="base-price-row">

                        <span>Base Price:</span>

                        <strong id="basePriceDisplay">
                            ₱0.00
                        </strong>

                    </div>


                    <!-- ==================================
                         TOTAL PRICE
                    =================================== -->

                    <div class="price-breakdown">

                        <span>Total Price:</span>

                        <strong id="dynamicPrice">
                            ₱0.00
                        </strong>

                    </div>


                    <!-- ==================================
                         ADD TO CART
                    =================================== -->

                    <button type="button"
                            class="add-cart-btn"
                            onclick="addToCart()">

                        Add to Cart 🛒

                    </button>

                </form>

            </div>

        </div>

    </div>


    <!-- ======================================
         SHOPPING CART MODAL
    ======================================= -->

    <div class="modal-backdrop" id="cartModal">

        <div class="modal-card cart-modal-card">

            <!-- CLOSE BUTTON -->

            <button class="close-btn"
                    onclick="toggleCartModal()">
                &times;
            </button>


            <h2>Your Shopping Cart 🛒</h2>


            <!-- CART ITEMS -->

            <div class="cart-items-list"
                 id="cartItemsList">

                <p class="empty-msg">
                    Your cart is currently empty.
                </p>

            </div>


            <!-- ==================================
                 CART SUMMARY
            =================================== -->

            <div class="cart-summary">

                <div class="cart-total-row">

                    <span>Grand Total:</span>

                    <strong id="cartGrandTotal">
                        ₱0.00
                    </strong>

                </div>


                <!-- CHECKOUT BUTTON -->

                <button class="checkout-btn"
                        onclick="checkoutOrder()">

                    Proceed to Checkout

                </button>

            </div>

        </div>

    </div>


    <!-- ======================================
         JAVASCRIPT
    ======================================= -->

    <script src="script.js"></script>

</body>

</html>
