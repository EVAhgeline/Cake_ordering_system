
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Management | Sweet Custom</title>

    <link rel="stylesheet" href="employee-style.css">
</head>

<body>

    <!-- ======================================
         SIDEBAR
    ======================================= -->

    <aside class="sidebar">

        <h2>🍰 Sweet Custom</h2>
        <p class="sidebar-label">EMPLOYEE PANEL</p>

        <a href="employee.html" class="nav-link">
            🏠 Dashboard
        </a>

        <a href="employees.html" class="nav-link active">
            👩‍💼 Employees
        </a>

        <a href="inventory.html" class="nav-link">
            📦 Inventory
        </a>

        <button type="button" class="logout-btn" onclick="logout()">
            ↪ Logout
        </button>

    </aside>


    <!-- ======================================
         MAIN CONTENT
    ======================================= -->

    <main class="main-content">

        <!-- TOPBAR -->

        <header class="topbar">

            <div>
                <h1>Employee Management</h1>
                <p>Manage your employee information.</p>
            </div>

            <div class="profile">
                Welcome,
                <strong id="employeeName">Employee</strong>
            </div>

        </header>


        <!-- ======================================
             EMPLOYEE FORM
        ======================================= -->

        <section class="form-panel">

            <h2 id="formTitle">Add New Employee</h2>

            <form id="employeeForm">

                <input type="hidden" id="employeeId">

                <div class="form-grid">

                    <!-- FULL NAME -->

                    <div class="form-group">
                        <label for="name">Full Name</label>

                        <input
                            type="text"
                            id="name"
                            placeholder="Enter full name"
                            required>
                    </div>


                    <!-- ROLE -->

                    <div class="form-group">
                        <label for="role">Position / Role</label>

                        <input
                            type="text"
                            id="role"
                            placeholder="e.g. Baker, Cashier"
                            required>
                    </div>


                    <!-- CONTACT -->

                    <div class="form-group">
                        <label for="contact">Contact Number</label>

                        <input
                            type="text"
                            id="contact"
                            placeholder="Enter contact number">
                    </div>


                    <!-- EMAIL -->

                    <div class="form-group">
                        <label for="email">Email Address</label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter email address">
                    </div>


                    <!-- ADDRESS -->

                    <div class="form-group">
                        <label for="address">Address</label>

                        <input
                            type="text"
                            id="address"
                            placeholder="Enter address">
                    </div>


                    <!-- HIRE DATE -->

                    <div class="form-group">
                        <label for="hire_date">Hire Date</label>

                        <input
                            type="date"
                            id="hire_date">
                    </div>


                    <!-- EMPLOYMENT STATUS -->

                    <div class="form-group">
                        <label for="status">Employment Status</label>

                        <select id="status">
                            <option value="Active">Active</option>
                            <option value="Inactive">Inactive</option>
                        </select>
                    </div>

                </div>


                <!-- FORM BUTTONS -->

                <div class="form-actions">

                    <button
                        type="submit"
                        class="primary-btn"
                        id="saveBtn">
                        Add Employee
                    </button>

                    <button
                        type="button"
                        class="cancel-btn"
                        id="cancelEmployee">
                        Clear
                    </button>

                </div>

                <p class="message" id="formMessage"></p>

            </form>

        </section>


        <!-- ======================================
             EMPLOYEE SEARCH
        ======================================= -->

        <div class="toolbar">

            <h2>Employee Records</h2>

            <input
                type="search"
                class="search-input"
                id="employeeSearch"
                placeholder="Search employee...">

        </div>


        <!-- ======================================
             EMPLOYEE TABLE
        ======================================= -->

        <section class="table-container">

            <table>

                <thead>
                    <tr>
                        <th>Employee ID</th>
                        <th>Name</th>
                        <th>Role</th>
                        <th>Contact</th>
                        <th>Email</th>
                        <th>Hire Date</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="employeeTableBody">

                    <tr>
                        <td colspan="8">
                            Loading employees...
                        </td>
                    </tr>

                </tbody>

            </table>

        </section>

    </main>


    <!-- ======================================
         EMPLOYEE INFORMATION AND LOGOUT
    ======================================= -->

    <script>

        // DISPLAY EMPLOYEE NAME

        document.getElementById('employeeName').textContent =
            sessionStorage.getItem('employeeName') || 'Employee';


        // LOGOUT FUNCTION

        function logout() {

            const confirmed = confirm(
                'Are you sure you want to log out?'
            );

            if (!confirmed) return;

            sessionStorage.removeItem('employeeToken');
            sessionStorage.removeItem('employeeName');
            sessionStorage.removeItem('token');

            document.querySelector('.sidebar').style.display = 'none';

            document.querySelector('.main-content').innerHTML = `
                <section class="welcome-banner">
                    <h2>You have logged out.</h2>
                    <p>Your employee session has been cleared.</p>
                </section>
            `;
        }

    </script>


    <!-- ======================================
         EMPLOYEE CRUD JAVASCRIPT
    ======================================= -->

    <script src="js/employees.js"></script>

</body>
</html>
